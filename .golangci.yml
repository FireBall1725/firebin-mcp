# golangci-lint v2 configuration for firebin-mcp.
#
# Keep this in step with the runner pinned in .github/workflows/ci.yml:
# golangci-lint-action@v8 with version v2.11.4. Older action majors install a
# v1 binary, which rejects this file outright with "unsupported version of the
# configuration".
#
# What's enabled:
#
#   standard set: errcheck, govet, ineffassign, staticcheck, unused
#   bodyclose:    this process is one big HTTP client; a leaked response body
#                 leaks a file descriptor per tool call
#   misspell:     typos in tool descriptions are typos the model reads
version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - misspell
  settings:
    errcheck:
      exclude-functions:
        # Deferred Close on response bodies and other io.Closer values — the
        # read path already surfaced anything that mattered.
        - (io.Closer).Close
        # These encoders write straight to the ResponseWriter; an I/O failure
        # surfaces through the writer, not the encoder's return.
        - (*encoding/json.Encoder).Encode
        - (net/http.ResponseWriter).Write

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
